name: Auto-Blog Generator

on:
  schedule:
    # 4× daily — UTC times below. Equivalent Toronto/EDT times in comments.
    - cron: '0 0 * * *'    # 00:00 UTC = 08:00 PM EDT (evening)
    - cron: '0 6 * * *'    # 06:00 UTC = 02:00 AM EDT (overnight)
    - cron: '0 12 * * *'   # 12:00 UTC = 08:00 AM EDT (morning)
    - cron: '0 18 * * *'   # 18:00 UTC = 02:00 PM EDT (afternoon)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-blog
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate blog articles
        run: node .github/scripts/auto-blog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject contextual product links into new articles
        # Runs the link injector over the whole /insights/ corpus.
        # The script is idempotent — already-linked articles are skipped via
        # pre-scan for existing class="internal-product-link" tags, so only
        # the newly-generated articles from the previous step get touched.
        # If no keywords match in a new article, it is left untouched.
        # Safe to re-run on every cron tick.
        run: python3 .github/scripts/inject_product_links.py
        env:
          SITE_ROOT: ${{ github.workspace }}

      - name: Inject contextual dashboard/app links (topic-matched + parenthetical asides)
        # Second pass: for each article, scores every live app / dashboard
        # target by topical keyword density, picks the BEST match, and injects
        # ONE creative link + parenthetical aside at the end of the sentence
        # containing the matched keyword.
        # Skips articles that already have a contextual-link (idempotent) or
        # that don't have a clear topical match (min 2 keyword hits).
        # Targets: markets dashboard, retail dashboard, supply chain (Meridian),
        # SaaS (Velocity), banking risk (Sentinel), IT service, customer payments,
        # e-bill, AI dashboard builder, time series, weather load forecast,
        # database archaeology, fuzzy address matching, personalized power automate.
        run: python3 .github/scripts/inject_contextual_links.py
        env:
          SITE_ROOT: ${{ github.workspace }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit + push (deploy auto-fires via workflow_run trigger on deploy.yml)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Auto-Blog Bot"
          git config user.email "blog-bot@insight-analytics.ca"
          git commit -m "blog: auto-generated AI articles — $(date -u +%Y-%m-%d-%H%M) + product links"
          git push
          echo "Pushed. deploy.yml will auto-fire via workflow_run trigger (no manual dispatch needed)."
