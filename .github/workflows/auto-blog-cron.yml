name: Auto-Blog Generator

on:
  schedule:
    - cron: '0 12 * * *'
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-blog
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog articles
        run: node .github/scripts/auto-blog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit + push (deploy auto-fires via workflow_run trigger on deploy.yml)
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Auto-Blog Bot"
          git config user.email "blog-bot@insight-analytics.ca"
          git commit -m "blog: auto-generated AI articles — $(date -u +%Y-%m-%d-%H%M)"
          git push
          echo "Pushed. deploy.yml will auto-fire via workflow_run trigger (no manual dispatch needed)."
