name: SEO Optimization Cron

on:
  schedule:
    # Run daily at 6:00 AM UTC — collects trends + (on Sundays) applies rewrites
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo
  cancel-in-progress: true

jobs:
  seo-optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 1: existing static SEO optimizer (schema, preloading, etc.)
      - name: Run static SEO optimizer
        run: node .github/scripts/seo-optimizer.mjs

      # Step 2: adaptive SEO rewriter
      # - Daily: collects trends (Google Autocomplete + industry RSS) → seo-trends.json
      # - Sundays only: actually rewrites titles/descriptions/FAQ
      # - Force mode (workflow_dispatch): always rewrites regardless of day
      - name: Run adaptive SEO (trend collection + weekly rewrite)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Detect if this is a manual trigger (workflow_dispatch) — if so, use --force
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — running with --force"
            node .github/scripts/adaptive-seo.mjs --force
          else
            node .github/scripts/adaptive-seo.mjs
          fi

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit SEO updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "SEO Bot"
          git config user.email "seo-bot@insightanalyticsca.github.io"

          # Get a summary of what changed
          SUMMARY=$(git diff --cached --stat | tail -1)

          # Detect day-of-week for commit message
          DOW=$(date -u +%w)
          if [ "$DOW" = "0" ]; then
            MODE="weekly rewrite (Sunday) + daily scan"
          else
            MODE="daily scan only (rewrite fires Sunday)"
          fi

          git commit -m "chore(seo): ${MODE}

          ${SUMMARY}

          Adaptive SEO state files:
          - seo-trends.json: latest trend collection (Google Autocomplete + industry RSS)
          - seo-state.json: per-URL rewrite history + cooldowns
          - seo-changelog.json: append-only audit log of every rewrite

          [skip ci]"
          git push
          echo "✅ Committed + pushed. The deploy.yml workflow will auto-deploy to GitHub Pages."
